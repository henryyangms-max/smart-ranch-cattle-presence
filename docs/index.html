<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>智能牧场 | 牛脸检测验证台</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./ort.wasm.min.js" defer></script>
  <script src="./inference.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <main>
    <header class="top">
      <a class="brand" href="./">智能牧场</a>
      <p class="health" id="health">正在加载轻量牛脸模型</p>
    </header>
    <section class="intro">
      <h1>牛脸检测验证台</h1>
      <p>选择一张牧场照片，直接在浏览器内画出牛脸蓝框。照片留在你的设备上。</p>
    </section>
    <div class="workbench">
      <section class="workspace" aria-label="照片及检测标注">
        <div id="photo-view" class="photo-view" hidden>
          <img id="photo" alt="待检测的牧场照片">
          <svg id="overlay" xmlns="http://www.w3.org/2000/svg" aria-label="牛脸框"></svg>
        </div>
        <div class="empty" id="blank">
          <span aria-hidden="true" class="crosshair"></span>
          <p>等候照片</p>
          <span>可拖拽照片到此，或从设备选择。</span>
        </div>
        <div class="photo-toolbar">
          <div id="file-description">JPEG、PNG、WebP · 最大 12 MiB</div>
          <div class="actions">
            <button class="secondary" type="button" id="sample">试用双牛样图</button>
            <label class="upload">选择照片<input id="file" type="file" accept="image/jpeg,image/png,image/webp"></label>
          </div>
        </div>
      </section>
      <aside aria-label="检测结果">
        <h2>检测结果</h2>
        <div class="summary" role="status" aria-live="polite" id="summary">选择照片开始检测</div>
        <p id="dimensions" hidden></p>
        <div id="metrics" class="metrics" hidden>
          <div><span>检测耗时</span><strong id="latency"></strong></div>
          <div><span>分数门槛</span><strong id="threshold"></strong></div>
        </div>
        <ol id="results" class="results"></ol>
        <section class="output-actions" id="output-actions" hidden>
          <button class="secondary" type="button" id="toggle" aria-pressed="true">隐藏蓝框</button>
          <button class="secondary" type="button" id="download">保存坐标</button>
        </section>
      </aside>
    </div>
  </main>
</body>
</html>
